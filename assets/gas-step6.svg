<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css');
      text { font-family: 'SUIT', 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; letter-spacing: -0.02em; }
      .title { font-size: 20px; font-weight: 800; fill: #0f172a; }
      .badge-step { font-size: 12px; font-weight: 800; fill: #ffffff; }
      .url-txt { font-family: Consolas, monospace; font-size: 12px; fill: #1e40af; }
      .callout { font-size: 13.5px; font-weight: 800; fill: #ffffff; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#dc2626" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="#f8fafc" rx="12"/>

  <!-- Top Title Bar -->
  <rect x="24" y="16" width="76" height="24" rx="12" fill="#0284c7"/>
  <text x="62" y="32" text-anchor="middle" class="badge-step">STEP 6</text>
  <text x="110" y="34" class="title">6단계: 배포 완료창의 [웹 앱 URL] 복사 ➔ 본 프로그램에 붙여넣기!</text>

  <!-- Browser Frame -->
  <g transform="translate(24, 52)" filter="url(#shadow)">
    <rect width="912" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 902 0 Q 912 0 912 10 L 912 36 L 0 36 Z" fill="#e2e8f0"/>
    
    <!-- Deployment Finished Modal -->
    <rect x="0" y="36" width="912" height="428" fill="#f8fafc"/>

    <g transform="translate(186, 70)" filter="url(#shadow)">
      <rect width="540" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      
      <circle cx="50" cy="48" r="16" fill="#dcfce7"/>
      <text x="50" y="54" text-anchor="middle" font-size="18" fill="#15803d">✓</text>
      
      <text x="80" y="54" font-size="18" font-weight="800" fill="#0f172a">새 배포가 완료되었습니다</text>
      
      <!-- Web App URL Box -->
      <text x="36" y="110" font-size="13" font-weight="800" fill="#1e293b">웹 앱 URL (이 주소를 복사하세요):</text>
      <g transform="translate(36, 122)">
        <rect width="468" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="14" y="27" class="url-txt">https://script.google.com/macros/s/AKfycb.../exec</text>
        
        <!-- Copy Button inside box -->
        <g transform="translate(390, 8)">
          <rect width="70" height="28" rx="6" fill="#2563eb"/>
          <text x="35" y="19" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">복사</text>
        </g>
      </g>

      <!-- Paste target description -->
      <rect x="36" y="190" width="468" height="80" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text x="52" y="216" font-size="13" font-weight="800" fill="#166534">🎉 이제 본 웹 프로그램의 [구글 시트 연동]에 붙여넣으세요!</text>
      <text x="52" y="238" font-size="12" fill="#15803d">• 저장 시 선생님의 개인 구글 시트로 1초 만에 자동 전송됩니다.</text>
      <text x="52" y="256" font-size="12" fill="#15803d">• 바이트(LENB) 및 출결(COUNTIF) 표준 수식이 자동 작동합니다.</text>

      <!-- Done Button -->
      <g transform="translate(400, 286)">
        <rect width="104" height="38" rx="6" fill="#0f172a"/>
        <text x="52" y="24" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">완료</text>
      </g>
    </g>

    <!-- Callout on Copy Button -->
    <g transform="translate(480, 166)" filter="url(#badgeShadow)">
      <rect width="320" height="34" rx="6" fill="#dc2626"/>
      <polygon points="160,0 170,-10 180,0" fill="#dc2626"/>
      <text x="160" y="22" text-anchor="middle" class="callout">👆 [복사] 후 본 프로그램에 붙여넣기!</text>
    </g>
  </g>
</svg>