<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css');
      text { font-family: 'SUIT', 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; letter-spacing: -0.02em; }
      .title { font-size: 20px; font-weight: 800; fill: #0f172a; }
      .badge-step { font-size: 12px; font-weight: 800; fill: #ffffff; }
      .sheet-title { font-size: 15px; font-weight: 700; fill: #1e293b; }
      .callout { font-size: 13.5px; font-weight: 800; fill: #ffffff; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#dc2626" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#f8fafc" rx="12"/>

  <!-- Top Title Bar -->
  <rect x="24" y="16" width="76" height="24" rx="12" fill="#059669"/>
  <text x="62" y="32" text-anchor="middle" class="badge-step">STEP 1</text>
  <text x="110" y="34" class="title">1단계: 관계형 구글 시트 마스터 템플릿 사본 만들기</text>

  <!-- Browser Frame -->
  <g transform="translate(24, 52)" filter="url(#shadow)">
    <rect width="912" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Browser Top -->
    <path d="M 0 10 Q 0 0 10 0 L 902 0 Q 912 0 912 10 L 912 36 L 0 36 Z" fill="#e2e8f0"/>
    <!-- Tab -->
    <path d="M 12 36 L 22 10 Q 25 6 32 6 L 230 6 Q 237 6 240 10 L 250 36 Z" fill="#ffffff"/>
    <circle cx="34" cy="21" r="5" fill="#0f9d58"/>
    <text x="46" y="25" font-size="12" font-weight="600" fill="#334155">문서 사본 만들기 - Google Sheets</text>
    <g transform="translate(840, 12)">
      <line x1="0" y1="6" x2="10" y2="6" stroke="#64748b" stroke-width="1.2"/>
      <rect x="22" y="1" width="9" height="9" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <line x1="44" y1="1" x2="52" y2="9" stroke="#64748b" stroke-width="1.2"/>
      <line x1="52" y1="1" x2="44" y2="9" stroke="#64748b" stroke-width="1.2"/>
    </g>

    <!-- Google Drive Copy Screen Body -->
    <rect x="0" y="36" width="912" height="428" fill="#f8fafc"/>
    <rect x="186" y="80" width="540" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

    <g transform="translate(226, 120)">
      <!-- Google Sheets Logo -->
      <rect x="0" y="0" width="40" height="48" rx="4" fill="#0f9d58"/>
      <rect x="8" y="14" width="24" height="4" fill="#ffffff"/>
      <rect x="8" y="22" width="24" height="4" fill="#ffffff"/>
      <rect x="8" y="30" width="16" height="4" fill="#ffffff"/>

      <text x="56" y="22" font-size="18" font-weight="800" fill="#0f172a">문서 사본 만들기</text>
      <text x="56" y="44" font-size="13" fill="#64748b">'2026학년도 생기부 &amp; 2027 대입상담 관계형 마스터 시트' 사본을 만드시겠습니까?</text>
    </g>

    <!-- Info Box -->
    <rect x="226" y="200" width="460" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="242" y="226" font-size="12.5" font-weight="700" fill="#1e40af">🔒 100% 교원 프라이버시 보호 보장 (BYOS)</text>
    <text x="242" y="248" font-size="12" fill="#3b82f6">선생님의 개인 Google 드라이브로 복사되며, 외부 서버로 학생 정보가 유출되지 않습니다.</text>

    <!-- Make a copy button -->
    <g transform="translate(490, 296)">
      <rect width="196" height="44" rx="8" fill="#0f9d58" filter="url(#shadow)"/>
      <text x="98" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">사본 만들기 ➔</text>
    </g>

    <!-- Callout Overlay -->
    <g transform="translate(420, 260)" filter="url(#badgeShadow)">
      <rect width="280" height="34" rx="6" fill="#dc2626"/>
      <polygon points="190,34 200,44 210,34" fill="#dc2626"/>
      <text x="140" y="22" text-anchor="middle" class="callout">👆 [사본 만들기] 버튼을 클릭하세요!</text>
    </g>
  </g>
</svg>