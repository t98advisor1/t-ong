<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css');
      text { font-family: 'SUIT', 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; letter-spacing: -0.02em; }
      .title { font-size: 20px; font-weight: 800; fill: #0f172a; }
      .desc { font-size: 13.5px; fill: #475569; }
      .badge-step { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .url-bar { font-size: 12px; font-family: Consolas, monospace; fill: #1e293b; }
      .callout-txt { font-size: 14px; font-weight: 800; fill: #ffffff; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#dc2626" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="540" fill="#f1f5f9" rx="12"/>

  <!-- Top Title Bar -->
  <rect x="24" y="16" width="76" height="24" rx="12" fill="#2563eb"/>
  <text x="62" y="32" text-anchor="middle" class="badge-step">STEP 2</text>
  <text x="110" y="34" class="title">2단계: 서비스 이용 약관 동의 (최초 1회)</text>

  <!-- Chrome Browser Window Frame -->
  <g transform="translate(24, 52)" filter="url(#shadow)">
    <!-- Window Body -->
    <rect width="912" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Title Bar -->
    <path d="M 0 10 Q 0 0 10 0 L 902 0 Q 912 0 912 10 L 912 36 L 0 36 Z" fill="#e2e8f0"/>
    <!-- Chrome Tab -->
    <path d="M 12 36 L 22 10 Q 25 6 32 6 L 210 6 Q 217 6 220 10 L 230 36 Z" fill="#ffffff"/>
    <circle cx="34" cy="21" r="5" fill="#3b82f6"/>
    <text x="46" y="25" font-size="12" font-weight="600" fill="#334155">Google AI Studio</text>
    <text x="206" y="24" font-size="11" fill="#94a3b8">✕</text>

    <!-- Window Controls (Win11) -->
    <g transform="translate(840, 12)">
      <line x1="0" y1="6" x2="10" y2="6" stroke="#64748b" stroke-width="1.2"/>
      <rect x="22" y="1" width="9" height="9" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <path d="M 44 1 L 53 10 M 53 1 L 44 10" stroke="#64748b" stroke-width="1.2"/>
    </g>

    <!-- Address Bar -->
    <rect y="36" width="912" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M 16 53 L 23 47 M 16 53 L 23 59" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 33 53 L 26 47 M 33 53 L 26 59" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="50" cy="53" r="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="68" y="41" width="828" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="82" y="57" class="url-bar">🔒 https://aistudio.google.com/apikey</text>

    <!-- Inner Web Content -->
    
    <!-- Background Blur Simulation -->
    <rect y="70" width="912" height="394" fill="#0f172a" opacity="0.35"/>

    <!-- Terms Modal Dialog -->
    <g transform="translate(216, 95)" filter="url(#shadow)">
      <rect width="480" height="340" rx="14" fill="#ffffff"/>
      
      <text x="32" y="42" font-size="19" font-weight="800" fill="#0f172a">Google AI Studio 시작하기</text>
      <text x="32" y="66" font-size="13" fill="#64748b">원활한 API 사용을 위해 서비스 약관에 동의해 주세요. (최초 1회)</text>

      <!-- Terms box -->
      <rect x="32" y="85" width="416" height="125" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="46" y="112" font-size="12.5" fill="#334155" font-weight="600">Google APIs 이용약관 및 Gemini API 추가 약관</text>
      <text x="46" y="134" font-size="11.5" fill="#64748b">• 개인 사용자는 월 무료 쿼리 한도 내에서 완전 무료로 사용 가능합니다.</text>
      <text x="46" y="154" font-size="11.5" fill="#64748b">• API 키는 타인에게 공유하지 마시고 비밀번호처럼 안전하게 보관하세요.</text>
      <text x="46" y="174" font-size="11.5" fill="#64748b">• 학생 개인정보가 입력되지 않도록 유의해 주세요.</text>

      <!-- Checkbox (Checked) -->
      <g transform="translate(32, 230)">
        <rect width="22" height="22" rx="5" fill="#2563eb"/>
        <path d="M 5 11 L 9 16 L 17 6" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <text x="32" y="16" font-size="13.5" font-weight="700" fill="#0f172a">약관을 확인하였으며 이에 동의합니다 (필수)</text>
      </g>

      <!-- Buttons -->
      <rect x="320" y="275" width="128" height="42" rx="8" fill="#2563eb"/>
      <text x="384" y="301" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Continue (계속)</text>
    </g>

    <!-- RED BOX & CURVED ARROW -->
    <!-- Red Box around checkbox and Continue button -->
    <rect x="238" y="318" width="436" height="106" rx="10" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-dasharray="6 4"/>

    <!-- Curved Arrow pointing to Continue -->
    <path d="M 770 340 Q 690 380 615 372" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowRed)"/>

    <!-- Callout Badge -->
    <g transform="translate(670, 275)" filter="url(#badgeShadow)">
      <rect width="216" height="52" rx="8" fill="#dc2626"/>
      <text x="108" y="24" text-anchor="middle" class="callout-txt">약관 체크 &amp; Continue</text>
      <text x="108" y="42" text-anchor="middle" font-size="11.5" fill="#fecaca">1. 동의 체크  2. Continue 클릭</text>
    </g>

  </g>
</svg>
