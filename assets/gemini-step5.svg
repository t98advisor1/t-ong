<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css');
      text { font-family: 'SUIT', 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; letter-spacing: -0.02em; }
      .title { font-size: 20px; font-weight: 800; fill: #0f172a; }
      .desc { font-size: 13.5px; fill: #475569; }
      .badge-step { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .url-bar { font-size: 12px; font-family: Consolas, monospace; fill: #1e293b; }
      .callout-txt { font-size: 14px; font-weight: 800; fill: #ffffff; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#dc2626" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="540" fill="#f1f5f9" rx="12"/>

  <!-- Top Title Bar -->
  <rect x="24" y="16" width="76" height="24" rx="12" fill="#2563eb"/>
  <text x="62" y="32" text-anchor="middle" class="badge-step">STEP 5</text>
  <text x="110" y="34" class="title">5단계: 발급된 API 키 [Copy] 버튼 클릭하여 복사</text>

  <!-- Chrome Browser Window Frame -->
  <g transform="translate(24, 52)" filter="url(#shadow)">
    <!-- Window Body -->
    <rect width="912" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Title Bar -->
    <path d="M 0 10 Q 0 0 10 0 L 902 0 Q 912 0 912 10 L 912 36 L 0 36 Z" fill="#e2e8f0"/>
    <!-- Chrome Tab -->
    <path d="M 12 36 L 22 10 Q 25 6 32 6 L 210 6 Q 217 6 220 10 L 230 36 Z" fill="#ffffff"/>
    <circle cx="34" cy="21" r="5" fill="#3b82f6"/>
    <text x="46" y="25" font-size="12" font-weight="600" fill="#334155">Google AI Studio</text>
    <text x="206" y="24" font-size="11" fill="#94a3b8">✕</text>

    <!-- Window Controls (Win11) -->
    <g transform="translate(840, 12)">
      <line x1="0" y1="6" x2="10" y2="6" stroke="#64748b" stroke-width="1.2"/>
      <rect x="22" y="1" width="9" height="9" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <path d="M 44 1 L 53 10 M 53 1 L 44 10" stroke="#64748b" stroke-width="1.2"/>
    </g>

    <!-- Address Bar -->
    <rect y="36" width="912" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M 16 53 L 23 47 M 16 53 L 23 59" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 33 53 L 26 47 M 33 53 L 26 59" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="50" cy="53" r="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="68" y="41" width="828" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="82" y="57" class="url-bar">🔒 https://aistudio.google.com/apikey</text>

    <!-- Inner Web Content -->
    
    <!-- Background Blur Simulation -->
    <rect y="70" width="912" height="394" fill="#0f172a" opacity="0.35"/>

    <!-- Modal Dialog: Your API key -->
    <g transform="translate(206, 110)" filter="url(#shadow)">
      <rect width="500" height="295" rx="14" fill="#ffffff"/>

      <!-- Success Icon -->
      <circle cx="56" cy="48" r="18" fill="#dcfce7"/>
      <path d="M 48 48 L 54 54 L 64 42" fill="none" stroke="#15803d" stroke-width="2.8" stroke-linecap="round"/>
      <text x="86" y="48" font-size="18" font-weight="800" fill="#0f172a">API 키가 발급되었습니다!</text>
      <text x="86" y="68" font-size="12.5" fill="#64748b">생성된 고유 키를 복사하여 도우미 앱에 등록해 주세요.</text>

      <!-- Key Display Box with Copy Button -->
      <rect x="32" y="95" width="436" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="48" y="128" font-size="14.5" font-family="Consolas, monospace" font-weight="700" fill="#0f172a">AIzaSyBw99xK_sample_key_99x</text>

      <!-- Copy Button -->
      <g id="btnCopyKey">
        <rect x="372" y="103" width="86" height="38" rx="6" fill="#2563eb"/>
        <text x="415" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Copy</text>
      </g>

      <!-- Caution message -->
      <rect x="32" y="165" width="436" height="52" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="48" y="186" font-size="12" font-weight="700" fill="#b91c1c">보안 주의사항</text>
      <text x="48" y="204" font-size="11.5" fill="#b91c1c">이 키는 개인 비밀번호와 같습니다. 타인에게 유출되지 않도록 주의하세요.</text>

      <!-- Close Button -->
      <rect x="368" y="235" width="100" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="418" y="259" text-anchor="middle" font-size="13.5" font-weight="600" fill="#475569">닫기</text>
    </g>

    <!-- RED BOX around Copy Button -->
    <rect x="570" y="208" width="98" height="48" rx="8" fill="rgba(220, 38, 38, 0.08)" stroke="#dc2626" stroke-width="3.5" filter="url(#redGlow)"/>

    <!-- Curved Arrow pointing to Copy -->
    <path d="M 770 280 Q 720 230 675 230" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowRed)"/>

    <!-- Callout Badge -->
    <g transform="translate(680, 275)" filter="url(#badgeShadow)">
      <rect width="210" height="52" rx="8" fill="#dc2626"/>
      <text x="105" y="24" text-anchor="middle" class="callout-txt">[Copy] 버튼 클릭</text>
      <text x="105" y="42" text-anchor="middle" font-size="11.5" fill="#fecaca">클립보드에 키가 복사됩니다</text>
    </g>

  </g>
</svg>
