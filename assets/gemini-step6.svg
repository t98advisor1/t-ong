<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css');
      text { font-family: 'SUIT', 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; letter-spacing: -0.02em; }
      .title { font-size: 20px; font-weight: 800; fill: #0f172a; }
      .desc { font-size: 13.5px; fill: #475569; }
      .badge-step { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .url-bar { font-size: 12px; font-family: Consolas, monospace; fill: #1e293b; }
      .callout-txt { font-size: 14px; font-weight: 800; fill: #ffffff; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#dc2626" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="540" fill="#f1f5f9" rx="12"/>

  <!-- Top Title Bar -->
  <rect x="24" y="16" width="76" height="24" rx="12" fill="#2563eb"/>
  <text x="62" y="32" text-anchor="middle" class="badge-step">STEP 6</text>
  <text x="110" y="34" class="title">6단계: 본 앱에 Ctrl + V 붙여넣기 후 [저장] 클릭</text>

  <!-- Chrome Browser Window Frame -->
  <g transform="translate(24, 52)" filter="url(#shadow)">
    <!-- Window Body -->
    <rect width="912" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Title Bar -->
    <path d="M 0 10 Q 0 0 10 0 L 902 0 Q 912 0 912 10 L 912 36 L 0 36 Z" fill="#e2e8f0"/>
    <!-- Chrome Tab -->
    <path d="M 12 36 L 22 10 Q 25 6 32 6 L 210 6 Q 217 6 220 10 L 230 36 Z" fill="#ffffff"/>
    <circle cx="34" cy="21" r="5" fill="#3b82f6"/>
    <text x="46" y="25" font-size="12" font-weight="600" fill="#334155">Google AI Studio</text>
    <text x="206" y="24" font-size="11" fill="#94a3b8">✕</text>

    <!-- Window Controls (Win11) -->
    <g transform="translate(840, 12)">
      <line x1="0" y1="6" x2="10" y2="6" stroke="#64748b" stroke-width="1.2"/>
      <rect x="22" y="1" width="9" height="9" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <path d="M 44 1 L 53 10 M 53 1 L 44 10" stroke="#64748b" stroke-width="1.2"/>
    </g>

    <!-- Address Bar -->
    <rect y="36" width="912" height="34" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M 16 53 L 23 47 M 16 53 L 23 59" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 33 53 L 26 47 M 33 53 L 26 59" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="50" cy="53" r="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="68" y="41" width="828" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="82" y="57" class="url-bar">🔒 https://aistudio.google.com/apikey</text>

    <!-- Inner Web Content -->
    
    <!-- App UI Mockup -->
    <rect y="70" width="912" height="394" fill="#f8fafc"/>

    <!-- App Header in mockup -->
    <rect y="70" width="912" height="48" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="24" y="100" font-size="15" font-weight="800" fill="#0f172a">학교생활기록부 점검 도우미</text>
    <rect x="220" y="80" width="130" height="28" rx="6" fill="#eff6ff"/>
    <text x="285" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">🔑 API 키 및 모델 설정</text>

    <!-- Settings Card Mockup -->
    <g transform="translate(96, 140)" filter="url(#shadow)">
      <rect width="720" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1"/>

      <text x="32" y="38" font-size="18" font-weight="800" fill="#0f172a">Gemini API 키 입력 및 저장</text>
      <text x="32" y="60" font-size="13" fill="#64748b">발급받은 키를 아래 입력창에 붙여넣고 [저장] 버튼을 눌러주세요.</text>

      <!-- Label -->
      <text x="32" y="102" font-size="14" font-weight="700" fill="#334155">Gemini API 키</text>

      <!-- Input box with pasted key -->
      <rect x="32" y="112" width="510" height="46" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
      <text x="48" y="141" font-size="14" font-family="Consolas, monospace" fill="#0f172a">AIzaSyBw99xK_sample_key_99x</text>

      <!-- Save Button -->
      <rect x="552" y="112" width="136" height="46" rx="8" fill="#2563eb"/>
      <text x="620" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">저장</text>

      <!-- Keyboard Shortcut Card for Windows -->
      <rect x="32" y="175" width="656" height="75" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="48" y="203" font-size="13" font-weight="700" fill="#1e293b">Windows 단축키 안내</text>
      <text x="48" y="228" font-size="12.5" fill="#475569">입력칸을 마우스로 클릭한 뒤 키보드의</text>

      <!-- Key Badge 1: Ctrl -->
      <rect x="260" y="210" width="54" height="26" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="287" y="228" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Ctrl</text>

      <text x="322" y="228" font-size="13" font-weight="700" fill="#64748b">+</text>

      <!-- Key Badge 2: V -->
      <rect x="336" y="210" width="34" height="26" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="353" y="228" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">V</text>

      <text x="380" y="228" font-size="12.5" fill="#475569">를 누르면 복사한 키가 바로 붙여넣어집니다.</text>
    </g>

    <!-- RED BOX around Input & Save button -->
    <rect x="120" y="245" width="672" height="60" rx="10" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-dasharray="6 4"/>
    <rect x="642" y="248" width="144" height="54" rx="10" fill="rgba(220, 38, 38, 0.08)" stroke="#dc2626" stroke-width="3.5" filter="url(#redGlow)"/>

    <!-- Curved Arrow -->
    <path d="M 780 370 Q 750 315 720 305" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowRed)"/>

    <!-- Callout Badge -->
    <g transform="translate(620, 370)" filter="url(#badgeShadow)">
      <rect width="250" height="52" rx="8" fill="#dc2626"/>
      <text x="125" y="24" text-anchor="middle" class="callout-txt">Ctrl+V 붙여넣기 후 [저장]</text>
      <text x="125" y="42" text-anchor="middle" font-size="11.5" fill="#fecaca">키가 안전하게 브라우저에 저장됩니다</text>
    </g>

  </g>
</svg>
