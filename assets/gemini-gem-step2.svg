<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%" style="font-family:'SUIT Variable', NanumSquareNeo, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3" />
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2029" />
      <stop offset="100%" stop-color="#14151c" />
    </linearGradient>
  </defs>

  <!-- Browser Window Frame -->
  <rect x="0" y="0" width="920" height="480" rx="14" fill="#0d0e12" />
  
  <!-- Window Header Bar -->
  <rect x="0" y="0" width="920" height="40" rx="14" fill="#1b1c24" />
  <rect x="0" y="28" width="920" height="12" fill="#1b1c24" />
  <circle cx="24" cy="20" r="6" fill="#ef4444" />
  <circle cx="44" cy="20" r="6" fill="#f59e0b" />
  <circle cx="64" cy="20" r="6" fill="#10b981" />
  <rect x="220" y="8" width="480" height="24" rx="6" fill="#0e0f14" />
  <text x="360" y="24" fill="#94a3b8" font-size="12">gemini.google.com/gems (Gemini 2.5 Pro)</text>

  <!-- Main Canvas Area -->
  <rect x="0" y="40" width="920" height="440" fill="url(#cardGrad)" />

  <!-- Step Content -->
  
  <!-- Left: Sidebar -->
  <rect x="40" y="140" width="220" height="310" rx="10" fill="#181822" />
  <text x="60" y="175" fill="#ffffff" font-size="15" font-weight="800">Gemini</text>
  <rect x="52" y="195" width="196" height="36" rx="8" fill="#2563eb" />
  <text x="66" y="218" fill="#ffffff" font-size="13" font-weight="700">+ 새 젬 만들기 (New Gem)</text>
  
  <!-- Right: Gem Setup Screen -->
  <rect x="280" y="140" width="600" height="310" rx="12" fill="#181822" stroke="#2e2e40" />
  <text x="310" y="175" fill="#ffffff" font-size="16" font-weight="800">젬(Gem) 세부정보 설정</text>
  
  <text x="310" y="210" fill="#cbd5e1" font-size="12" font-weight="700">이름</text>
  <rect x="310" y="220" width="540" height="34" rx="6" fill="#111118" stroke="#3b3b4f" />
  <text x="325" y="242" fill="#ffffff" font-size="13">생기부 탐구보고서 OCR 판독기 &amp; 시트 생성기</text>
  
  <text x="310" y="280" fill="#cbd5e1" font-size="12" font-weight="700">지침 (Instructions)</text>
  <rect x="310" y="290" width="540" height="110" rx="6" fill="#111118" stroke="#ef4444" stroke-width="2" />
  <text x="325" y="315" fill="#a7f3d0" font-size="12">1단계에서 복사한 맞춤형 프롬프트를 그대로 붙여넣습니다 (Ctrl+V)</text>
  <text x="325" y="340" fill="#94a3b8" font-size="11.5">- 3단 논법(동기-과정-성장) 규칙 및 금지어 배제 훈령 적용</text>
  <text x="325" y="365" fill="#94a3b8" font-size="11.5">- 구글 시트 호환 마크다운 테이블 자동 출력 설정</text>
  
  <rect x="740" y="410" width="110" height="32" rx="6" fill="#2563eb" />
  <text x="770" y="431" fill="#ffffff" font-size="13" font-weight="700">만들기</text>


  <!-- Floating Callout Step Banner -->
  <g filter="url(#shadow)">
    <rect x="28" y="56" width="360" height="64" rx="10" fill="#059669" />
    <text x="44" y="82" fill="#ffffff" font-size="15" font-weight="800">STEP 2. 전용 젬(Gem) 봇 세팅</text>
    <text x="44" y="105" fill="#f8fafc" font-size="12.5">이름을 정하고 프롬프트를 지침(Instructions)에 넣고 저장합니다.</text>
  </g>
</svg>