<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css');
      text { font-family: 'SUIT', 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; letter-spacing: -0.02em; }
      .title { font-size: 20px; font-weight: 800; fill: #0f172a; }
      .badge-step { font-size: 12px; font-weight: 800; fill: #ffffff; }
      .menu-item { font-size: 13px; fill: #1e293b; font-weight: 600; }
      .callout { font-size: 13.5px; font-weight: 800; fill: #ffffff; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#dc2626" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="#f8fafc" rx="12"/>

  <!-- Top Title Bar -->
  <rect x="24" y="16" width="76" height="24" rx="12" fill="#2563eb"/>
  <text x="62" y="32" text-anchor="middle" class="badge-step">STEP 2</text>
  <text x="110" y="34" class="title">2단계: 상단 메뉴 [확장 프로그램] ➔ [Apps Script] 클릭</text>

  <!-- Browser Frame -->
  <g transform="translate(24, 52)" filter="url(#shadow)">
    <rect width="912" height="464" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 902 0 Q 912 0 912 10 L 912 36 L 0 36 Z" fill="#e2e8f0"/>
    <path d="M 12 36 L 22 10 Q 25 6 32 6 L 250 6 Q 257 6 260 10 L 270 36 Z" fill="#ffffff"/>
    <circle cx="34" cy="21" r="5" fill="#0f9d58"/>
    <text x="46" y="25" font-size="12" font-weight="600" fill="#334155">2026 관계형 마스터 시트 (내 드라이브)</text>

    <!-- Google Sheet Menu Bar -->
    <rect x="0" y="36" width="912" height="72" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Sheet Title Area -->
    <g transform="translate(24, 46)">
      <rect x="0" y="0" width="20" height="24" rx="2" fill="#0f9d58"/>
      <text x="28" y="17" font-size="14" font-weight="800" fill="#0f172a">2026학년도 생기부 &amp; 대입상담 관계형 마스터 서식 (사본)</text>
    </g>

    <!-- Main Menus -->
    <g transform="translate(24, 76)">
      <text x="0" y="20" class="menu-item">파일</text>
      <text x="44" y="20" class="menu-item">수정</text>
      <text x="88" y="20" class="menu-item">보기</text>
      <text x="132" y="20" class="menu-item">삽입</text>
      <text x="176" y="20" class="menu-item">서식</text>
      <text x="220" y="20" class="menu-item">데이터</text>
      <text x="274" y="20" class="menu-item">도구</text>
      <!-- Highlighted 확장 프로그램 -->
      <rect x="312" y="2" width="102" height="26" rx="4" fill="#e0f2fe" stroke="#38bdf8"/>
      <text x="320" y="20" class="menu-item" fill="#0284c7">확장 프로그램</text>
      <text x="430" y="20" class="menu-item">도움말</text>
    </g>

    <!-- Dropdown Menu -->
    <g transform="translate(336, 108)" filter="url(#shadow)">
      <rect width="210" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="16" y="28" font-size="13" fill="#64748b">부가기능</text>
      <line x1="0" y1="40" x2="210" y2="40" stroke="#f1f5f9"/>
      
      <!-- Selected Apps Script -->
      <rect x="6" y="46" width="198" height="34" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <circle cx="24" cy="63" r="6" fill="#2563eb"/>
      <text x="38" y="68" font-size="13.5" font-weight="800" fill="#1d4ed8">Apps Script</text>
      <text x="180" y="67" font-size="13" fill="#2563eb">➔</text>
      
      <line x1="0" y1="86" x2="210" y2="86" stroke="#f1f5f9"/>
      <text x="16" y="102" font-size="12" fill="#94a3b8">매크로</text>
    </g>

    <!-- Grid Preview (Mock) -->
    <g transform="translate(24, 230)" opacity="0.45">
      <rect width="864" height="210" fill="#ffffff" stroke="#e2e8f0"/>
      <line x1="0" y1="32" x2="864" y2="32" stroke="#e2e8f0"/>
      <line x1="80" y1="0" x2="80" y2="210" stroke="#e2e8f0"/>
      <line x1="180" y1="0" x2="180" y2="210" stroke="#e2e8f0"/>
      <line x1="300" y1="0" x2="300" y2="210" stroke="#e2e8f0"/>
      <text x="20" y="22" font-size="12" font-weight="700">학번</text>
      <text x="100" y="22" font-size="12" font-weight="700">성명</text>
      <text x="200" y="22" font-size="12" font-weight="700">희망계열</text>
      <text x="320" y="22" font-size="12" font-weight="700">1지망 대학·전형</text>
    </g>

    <!-- Callout Target -->
    <g transform="translate(560, 140)" filter="url(#badgeShadow)">
      <rect width="280" height="34" rx="6" fill="#dc2626"/>
      <polygon points="0,17 -10,22 -10,12" fill="#dc2626"/>
      <text x="140" y="22" text-anchor="middle" class="callout">👆 [Apps Script]를 클릭하세요!</text>
    </g>
  </g>
</svg>