<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 판서 사용설명서 — 영상 · 단축키 핸드아웃</title>
  <meta name="description" content="스마트 판서 보드(v2.8)의 모든 기능을 음성 해설 영상과 단계별 설명, 단축키 핸드아웃으로 안내합니다.">
  <style>
    :root {
      --bg: #f4f6fb; --surface: #ffffff; --soft: #eef2ff; --text: #172033; --muted: #5b6478; --line: #e2e6ef;
      --accent: #2563eb; --accent-soft: #dbe7ff; --ok: #0f9d6b; --warn: #b45309; --dark: #0f172a; --side: 288px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Pretendard', 'Noto Sans KR', system-ui, -apple-system, sans-serif; line-height: 1.7; font-size: 17px; }
    a { color: var(--accent); }
    kbd { display: inline-block; min-width: 1.7em; padding: 1px 7px; border-radius: 6px; border: 1px solid #c9d1e3; border-bottom-width: 2px; background: #fff;
      font: 700 0.86em/1.6 ui-monospace, Consolas, monospace; color: var(--dark); text-align: center; white-space: nowrap; }
    button { font-family: inherit; }

    /* 위쪽 막대 */
    .topbar { position: sticky; top: 0; z-index: 30; height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 18px;
      background: linear-gradient(135deg, #1e3a8a, #2563eb 70%, #0ea5e9); color: #fff; box-shadow: 0 2px 14px rgba(2,6,23,.18); }
    .topbar h1 { margin: 0; font-size: 1.12rem; letter-spacing: -0.01em; white-space: nowrap; }
    .topbar h1 small { font-weight: 600; opacity: .8; margin-left: 6px; font-size: 0.8rem; }
    .topbar .sp { flex: 1; }
    .tbtn { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 10px; font-weight: 800; font-size: 0.88rem; text-decoration: none; cursor: pointer;
      border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; white-space: nowrap; }
    .tbtn.solid { background: #fff; color: var(--accent); border-color: #fff; }
    .menu-toggle { display: none; }
    .tpill { display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 12px; border-radius: 999px; background: rgba(15,23,42,.3); border: 1px solid rgba(255,255,255,.25); color: #e2e8f0; font-size: 0.8rem; font-weight: 700; white-space: nowrap; }
    .tpill b { color: #fde047; }
    @media (max-width: 1250px) { .tpill { display: none; } }

    /* 왼쪽 메뉴 + 본문 */
    .layout { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: calc(100vh - 60px); }
    .side { position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 14px 12px 40px; }
    .side h4 { margin: 18px 10px 6px; font-size: 0.76rem; color: var(--muted); letter-spacing: 0.04em; }
    .side h4:first-child { margin-top: 4px; }
    .side a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: var(--text); font-weight: 700; font-size: 0.93rem; line-height: 1.35; }
    .side a i { font-style: normal; flex: 0 0 26px; height: 26px; border-radius: 8px; background: var(--soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-size: 0.76rem; font-weight: 900; }
    .side a:hover { background: #f1f5ff; }
    .side a.active { background: var(--accent); color: #fff; }
    .side a.active i { background: rgba(255,255,255,.22); color: #fff; }
    .side .side-note { margin: 18px 10px 0; padding: 10px 12px; border-radius: 12px; background: #fff7ed; color: #9a3412; font-size: 0.82rem; line-height: 1.5; }

    .content { padding: 26px 32px 70px; min-width: 0; }
    .page { display: none; max-width: 1180px; margin: 0 auto; }
    .page.show { display: block; }
    .crumb { color: var(--muted); font-weight: 700; font-size: 0.86rem; margin-bottom: 4px; }
    .page h2 { margin: 0 0 4px; font-size: 1.75rem; letter-spacing: -0.02em; line-height: 1.3; }
    .page .lead { margin: 0 0 18px; color: var(--muted); font-size: 1.05rem; }

    /* 큰 영상 */
    .video-box { position: relative; border-radius: 16px; overflow: hidden; background: #0f172a; aspect-ratio: 16 / 9; box-shadow: 0 14px 36px rgba(15,23,42,.18); }
    .video-box video { width: 100%; height: 100%; display: block; }
    .video-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 2px 0; color: var(--muted); font-size: 0.86rem; }
    .video-tools button { border: 1px solid var(--line); background: #fff; color: var(--dark); border-radius: 8px; padding: 4px 10px; font-weight: 800; font-size: 0.82rem; cursor: pointer; }
    .video-tools button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .video-tools .sp { flex: 1; }
    .print-poster { display: none; }

    /* 영상 아래 설명 */
    .explain { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; margin-top: 22px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; }
    .card h3 { margin: 0 0 10px; font-size: 1.08rem; }
    ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
    ol.steps li { counter-increment: s; position: relative; padding: 0 0 12px 40px; }
    ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 2px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
      font-weight: 900; font-size: 0.86rem; display: flex; align-items: center; justify-content: center; }
    .keys { display: flex; flex-direction: column; gap: 8px; }
    .keys div { display: flex; align-items: center; gap: 10px; }
    .keys div > span:first-child { flex: 0 0 auto; }
    .keys em { font-style: normal; color: var(--accent); font-weight: 800; font-size: 0.8rem; margin-left: 4px; }
    .tip { margin-top: 18px; background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; border-radius: 14px; padding: 14px 18px; font-size: 0.96rem; }
    .warn { margin-top: 12px; background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; border-radius: 14px; padding: 12px 16px; font-size: 0.93rem; }
    .shot { margin-top: 22px; }
    .shot img { width: 100%; display: block; border-radius: 14px; border: 1px solid var(--line); background: #fff; }
    .shot figcaption { margin-top: 8px; color: var(--muted); font-size: 0.9rem; }
    .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; }
    .pager a { flex: 1; max-width: 48%; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; color: var(--text); font-weight: 800; }
    .pager a small { display: block; color: var(--muted); font-weight: 700; font-size: 0.8rem; }
    .pager a.next { text-align: right; margin-left: auto; }
    .pager a:hover { border-color: var(--accent); }

    /* 처음 화면 */
    .hello { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: center; background: linear-gradient(135deg, #1e3a8a, #2563eb 60%, #0ea5e9); color: #fff; border-radius: 22px; padding: 30px 32px; }
    .hello h2 { color: #fff; font-size: 1.9rem; }
    .hello p { color: #dbeafe; margin: 0 0 18px; font-size: 1.05rem; }
    .hello .video-box { box-shadow: 0 18px 40px rgba(2,6,23,.35); }
    .hello .video-tools { color: #dbeafe; }
    .vwrap { min-width: 0; }
    .hello .btns { display: flex; flex-wrap: wrap; gap: 10px; }
    .hello .btns a { display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 12px; font-weight: 800; text-decoration: none; background: #fff; color: var(--accent); }
    .hello .btns a.ghost { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.4); }
    .sec-title { margin: 34px 0 12px; font-size: 1.3rem; }
    .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .three .card > b { display: block; font-size: 1.05rem; margin: 6px 0 4px; }
    .three .card p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    .num { display: inline-flex; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; align-items: center; justify-content: center; font-weight: 900; font-size: 0.9rem; }
    .chap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .chap-grid a { display: block; text-decoration: none; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .chap-grid a:hover { border-color: var(--accent); box-shadow: 0 8px 20px rgba(37,99,235,.12); }
    .chap-grid img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #0f172a; }
    .chap-grid span { display: block; padding: 10px 12px 12px; font-weight: 800; font-size: 0.94rem; line-height: 1.4; }
    .chap-grid small { display: block; color: var(--muted); font-weight: 700; font-size: 0.78rem; }

    /* 단축키 핸드아웃 */
    .handout img { width: 100%; display: block; border-radius: 14px; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(15,23,42,.12); background: #fff; }
    .handout .btns { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 16px; }
    .handout .btns a, .handout .btns button { display: inline-flex; align-items: center; height: 42px; padding: 0 16px; border-radius: 11px; font-weight: 800; font-size: 0.92rem; text-decoration: none;
      border: 1px solid var(--line); background: #fff; color: var(--dark); cursor: pointer; }
    .handout .btns .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .sc-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); margin-top: 18px; font-size: 0.95rem; }
    .sc-table th, .sc-table td { padding: 9px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .sc-table th { background: #f8fafc; font-size: 0.84rem; color: var(--muted); }
    .sc-table td:first-child { white-space: nowrap; width: 1%; }
    .sc-table em { font-style: normal; color: var(--accent); font-weight: 800; font-size: 0.82rem; }

    .faq details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; }
    .faq summary { cursor: pointer; font-weight: 800; }
    .faq p, .faq ul { margin: 8px 0 2px; color: var(--muted); }

    /* 보드 안 창(embed)에서는 위쪽 막대를 낮춥니다 */
    body.embed .topbar { height: 52px; }
    body.embed .side { top: 52px; height: calc(100vh - 52px); }
    body.embed .only-page { display: none !important; }

    @media (max-width: 1100px) { .explain { grid-template-columns: 1fr; } .hello { grid-template-columns: 1fr; } }
    @media (max-width: 900px) {
      .menu-toggle { display: inline-flex; }
      .layout { grid-template-columns: 1fr; }
      .side { position: fixed; z-index: 40; left: 0; top: 60px; width: min(86vw, 320px); transform: translateX(-105%); transition: transform .22s ease; box-shadow: 8px 0 30px rgba(2,6,23,.2); }
      body.menu-open .side { transform: none; }
      body.menu-open::after { content: ''; position: fixed; inset: 60px 0 0 0; background: rgba(2,6,23,.35); z-index: 35; }
      .content { padding: 18px 16px 60px; }
      .topbar .hide-sm, .topbar h1 small, .tbtn .hide-sm-t { display: none; }
      .topbar { padding: 0 10px; gap: 8px; }
      .topbar h1 { font-size: 0.98rem; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .tbtn { padding: 0 10px; }
      .three { grid-template-columns: 1fr; }
      .page h2 { font-size: 1.4rem; }
    }

    /* 인쇄: 모든 장을 차례로, 영상 대신 장면 그림 */
    @media print {
      body { background: #fff; font-size: 12pt; }
      .topbar, .side, .pager, .video-tools, .hello .btns, .handout .btns { display: none !important; }
      .layout { display: block; }
      .content { padding: 0; }
      .page { display: block !important; page-break-after: always; max-width: none; }
      .video-box { box-shadow: none; aspect-ratio: auto; background: none; }
      .video-box video { display: none; }
      .print-poster { display: block; width: 100%; border: 1px solid #ccc; border-radius: 8px; }
      .explain { grid-template-columns: 1.4fr 1fr; }
      .card { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button type="button" class="tbtn menu-toggle" id="menuToggle" aria-label="목차 열기">☰</button>
    <h1>스마트 판서 사용설명서<small>v2.8 · 음성 영상</small></h1>
    <span class="sp"></span>
    <span class="tpill hide-sm" title="스마트 판서 익명 방문 현황 (판서 내용은 서버에 전송되지 않습니다)">오늘 방문자 <b id="guideTodayVisitors">–</b>명 · 총 이용 <b id="guideTotalVisits">–</b>회</span>
    <a class="tbtn hide-sm" href="#handout">🖨️ 단축키 핸드아웃</a>
    <button type="button" class="tbtn hide-sm" id="printBtn">인쇄 · PDF</button>
    <a class="tbtn solid only-page" href="./smart-board.html">✏️ <span class="hide-sm-t">스마트 판서 </span>열기</a>
  </header>

  <div class="layout">
    <nav class="side" id="side" aria-label="사용설명서 목차"></nav>
    <main class="content" id="content"></main>
  </div>

  <script>
  (function () {
    var VIDEO_DIR = './assets/smartboard_guide/video/';
    var SHOT_DIR = './assets/smartboard_guide/';
    if (/[?&]embed=1/.test(location.search)) document.body.classList.add('embed');
    function k(s) { return s.split('+').map(function (x) { return '<kbd>' + x + '</kbd>'; }).join('+'); }

    // ── 장 목록: 영상 · 영상 아래 설명 · 단축키 · 도움말 ─────────────────────
    var GROUPS = [
      { name: '시작하기', items: ['home', 'c01-start'] },
      { name: '기본 판서', items: ['c02-pen', 'c03-shapes', 'c04-stamps', 'c05-select', 'c06-pages'] },
      { name: '수업 자료 위에 판서', items: ['c07-pdf', 'c08-pptx', 'c09-web'] },
      { name: '더 잘 쓰기', items: ['c10-zoom', 'c11-pin', 'c12-edit'] },
      { name: '저장 · 공유', items: ['c13-notes', 'c14-backup', 'c15-share'] },
      { name: '설정 · 부록', items: ['c16-settings', 'handout', 'faq'] }
    ];
    var CH = {
      'c01-start': { n: 1, title: '처음 시작 · 화면 구성', lead: '열자마자 펜이 켜져 있어 바로 씁니다. 위쪽 두 줄이 도구 팔레트입니다.',
        steps: ['스마트 판서를 열면 <b>펜</b>이 켜져 있습니다. 손가락 · S펜 · 마우스로 바로 쓰세요.',
          '<b>첫 줄</b>: 홈 · 사용설명서 · 노트함 · 백업·복원 · 열기 · 모드(게시 · 확대 · 판서 · 편집) · PNG·PDF · 공유',
          '<b>둘째 줄</b>: 선택 · 펜 · 도형 · 자동 번호 · 레이저 · 지우개 · 색 · 굵기 · 되돌리기 · 쪽',
          '버튼 옆 작은 글자가 <b>단축키</b>입니다. 모르면 ' + k('?') + ' 키로 단축키 창을 엽니다.',
          k('Tab') + '으로 팔레트를 숨기면 화면 전체가 칠판이 됩니다. <b>자동숨김</b>을 켜면 쓰기 시작할 때 저절로 숨고, 화면 맨 위로 가면 다시 나옵니다.',
          '수업 화면을 크게 보여 줄 때는 <b>전체화면</b>(' + k('F') + ')'],
        keys: [['Tab', '팔레트 숨기기 · 펼치기'], ['F', '전체화면', 'Fullscreen'], ['?', '단축키 창 (F1)']],
        tip: '💡 처음이라면 이 세 가지만 기억하세요: 그냥 쓰기 · ' + k('Z') + ' 되돌리기 · ' + k('Tab') + ' 화면 넓게.',
        shot: ['manual_v4_01_shortcuts_toolbar.png', '도구 팔레트와 단축키 위치 한눈에 보기'] },
      'c02-pen': { n: 2, title: '펜 · 색 · 굵기 · 되돌리기', lead: '펜 종류와 색, 굵기를 바꾸고 잘못 쓴 것은 바로 되돌립니다.',
        steps: [k('P') + ' 펜(기본 2pt) · ' + k('H') + ' 형광펜(기본 6pt)',
          '숫자 ' + k('1') + '~' + k('6') + ': 빨강 · 초록 · 파랑 · 노랑 · 흰색 · 검정',
          '<b>− / +</b> 버튼(또는 마우스 휠)으로 굵기를 조절합니다.',
          '<b>펜 ▾</b> 메뉴에서 만년필 · 볼펜 · <b>연필</b>(사각거리는 질감) · 붓펜 · 형광펜을 고릅니다.',
          '잘못 썼다면 ' + k('Z') + ' 또는 ' + k('Esc') + ' — 한 번에 하나씩 되돌립니다.',
          k('X') + '를 누르면 되돌린 것을 다시 살립니다. ' + k('Ctrl+Z') + ' · ' + k('Ctrl+Y') + '도 같습니다.'],
        keys: [['P', '펜', 'Pen'], ['H', '형광펜', 'Highlighter'], ['1~6', '색 바꾸기'], ['Z', '되돌리기 (Esc · ,)'], ['X', '다시 실행 (.)']],
        tip: '💡 ' + k('Esc') + '는 열린 창·메뉴가 있으면 먼저 닫고, 없으면 되돌리기입니다.' },
      'c03-shapes': { n: 3, title: '도형 · 텍스트 · 꾹 눌러 도형', lead: '도형 메뉴나 단축키로 반듯한 도형과 글자를 넣고, 손으로 그린 도형을 꾹 눌러 반듯하게 만듭니다.',
        steps: ['<b>도형 ▾</b> 메뉴에서 직선 · 사각형 · 원 · 채움사각 · 텍스트를 고르고 끌어서 그립니다.',
          '단축키: ' + k('R') + ' 사각형 · ' + k('Shift+R') + ' 채움사각 · ' + k('C') + ' 원 · ' + k('L') + ' 직선',
          k('T') + '를 누르고 화면을 누르면 글자 입력칸이 열립니다. ' + k('Enter') + '로 확정합니다.',
          '<b>꾹 눌러 도형</b>: 펜으로 원 · 네모 · 세모 · 별 · 직선을 그리고 끝에서 0.5초 멈추면 반듯한 도형으로 바뀝니다. 형광펜에서도 됩니다.',
          '멈추지 않고 바로 떼면 손글씨 그대로 남습니다.'],
        keys: [['R', '사각형', 'Rectangle'], ['C', '원', 'Circle'], ['L', '직선', 'Line'], ['T', '텍스트', 'Text'], ['Shift+R', '채움사각']],
        tip: '💡 별은 한 붓으로(☆) 그려도, 테두리로 그려도 알아봅니다.' },

        '<div class="video-tools">🔊 음성 해설 · 속도 <button type="button" data-rate="0.75">0.75×</button><button type="button" data-rate="1" class="on">1×</button><button type="button" data-rate="1.25">1.25×</button><button type="button" data-rate="1.5">1.5×</button>' +
        '<span class="sp"></span><button type="button" data-fs>⛶ 크게 보기</button></div></div>';
    }
    var html = '';
    // 처음 화면
    html += '<section class="page" id="p-home"><div class="hello"><div><div class="crumb" style="color:#bfdbfe">스마트 판서 v2.8</div><h2>처음 사용하시나요?</h2>' +
      '<p>칠판처럼 쓰고, PDF · PPTX · 유튜브 위에 바로 판서하는 수업용 보드입니다. 왼쪽 목차에서 기능을 고르면 <b>음성 해설 영상</b>과 설명이 크게 나옵니다.</p>' +
      '<div class="btns"><a href="#c01-start">▶ 1장부터 보기</a><a class="ghost" href="#handout">🖨️ 단축키 핸드아웃</a></div></div>' + videoBlock('c01-start') + '</div>' +
      '<h3 class="sec-title">이 세 가지면 바로 수업할 수 있습니다</h3><div class="three">' +
      '<div class="card"><span class="num">1</span><b>그냥 쓰기</b><p>열면 펜이 켜져 있습니다. 숫자 ' + k('1') + '~' + k('6') + '으로 색, ' + k('H') + ' 형광펜.</p></div>' +
      '<div class="card"><span class="num">2</span><b>틀리면 ' + k('Z') + '</b><p>' + k('Z') + ' 되돌리기 · ' + k('X') + ' 다시 실행 · ' + k('E') + ' 지우개.</p></div>' +
      '<div class="card"><span class="num">3</span><b>자료 열기</b><p>위쪽 <b>열기</b>에서 PDF · PPTX · 사진 · 유튜브. 판서는 1분마다 자동 저장됩니다.</p></div></div>' +
      '<h3 class="sec-title">모든 기능 영상</h3><div class="chap-grid">' + ORDER.filter(function (id) { return CH[id]; }).map(function (id) {
        return '<a href="#' + id + '"><img loading="lazy" alt="" src="' + VIDEO_DIR + id + '.jpg"><span><small>' + CH[id].n + '장</small>' + CH[id].title + '</span></a>';
      }).join('') + '</div>' + pager('home') + '</section>';
    // 장
    Object.keys(CH).forEach(function (id) {
      var c = CH[id];
      html += '<section class="page" id="p-' + id + '"><div class="crumb">' + c.n + '장</div><h2>' + c.title + '</h2><p class="lead">' + c.lead + '</p>' + videoBlock(id) +
        '<div class="explain"><div class="card"><h3>이렇게 합니다</h3><ol class="steps">' + c.steps.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol></div>' +
        (c.keys && c.keys.length ? '<div class="card"><h3>이 장의 단축키</h3><div class="keys">' + c.keys.map(function (x) {
          return '<div><span>' + x[0].split(' · ').map(function (t) { return /[~ ]/.test(t) && !/^(← →)$/.test(t) ? '<kbd>' + t + '</kbd>' : (t === '← →' ? '<kbd>←</kbd> <kbd>→</kbd>' : k(t)); }).join(' · ') + '</span><span>' + x[1] + (x[2] ? '<em>' + x[2] + '</em>' : '') + '</span></div>';
        }).join('') + '</div></div>' : '') + '</div>' +
        (c.tip ? '<div class="tip">' + c.tip + '</div>' : '') + (c.warn ? '<div class="warn">⚠️ ' + c.warn + '</div>' : '') +
        (c.shot ? '<figure class="shot"><img loading="lazy" src="' + SHOT_DIR + c.shot[0] + '" alt="' + c.shot[1] + '"><figcaption>📷 ' + c.shot[1] + ' (그림을 누르면 크게 열립니다)</figcaption></figure>' : '') +
        pager(id) + '</section>';
    });
    // 단축키 핸드아웃
    var SC = [
      ['쓰기', [['P', '펜', 'Pen'], ['H', '형광펜', 'Highlighter'], ['1~6', '색: 빨강 · 초록 · 파랑 · 노랑 · 흰색 · 검정'], ['T', '텍스트', 'Text'], ['R · C · L', '사각형 · 원 · 직선'], ['꾹 멈춤', '손으로 그린 도형을 반듯하게']]],
      ['고치기', [['Z · Esc', '되돌리기'], ['X', '다시 실행'], ['E', '지우개', 'Eraser'], ['Shift+E', '펜 글씨 전체 지우기'], ['Ctrl+E', '전체 필기 지우기'], ['V', '선택해서 옮기기', 'Select']]],
      ['수업 진행', [['D', '레이저 (3초 뒤 사라짐)'], ['S · Q', '원형 · 사각 번호 스탬프'], ['SS · 0', '번호 1번부터 다시'], ['A', '밑줄·원 자동 번호', 'Auto'], ['Ctrl+S', '스탬프 전체 지우기'], ['Space · → / ←', '다음 / 이전 (쪽 · PPTX 장면)']]],
      ['화면', [['Ctrl+1', '확대 (한 번 더 → 원래대로)'], ['M', '확대 화면 이동', 'Move'], ['Ctrl+`', '게시(조각 고정)'], ['Ctrl+2 / Ctrl+3', '판서 / 편집'], ['Tab', '팔레트 숨기기'], ['F', '전체화면'], ['K / W', '칠판 / 백지']]],
      ['저장 · 나가기', [['Ctrl+P', '지금 화면 PNG 저장'], ['Ctrl+Shift+S', '노트 저장'], ['Backspace', '저장하고 나가기'], ['?', '단축키 창']]]
    ];
    html += '<section class="page handout" id="p-handout"><div class="crumb">부록</div><h2>단축키 핸드아웃</h2><p class="lead">자주 쓰는 단축키를 한 장에 모았습니다. 그림으로 저장해 휴대폰에 두거나, 인쇄해서 교탁에 붙여 두세요.</p>' +
      '<div class="btns"><a class="primary" href="' + SHOT_DIR + 'shortcut-handout.png" download="스마트판서_단축키_핸드아웃.png">⬇ 그림(PNG) 내려받기</a>' +
      '<a href="' + SHOT_DIR + 'shortcut-handout.pdf" download="스마트판서_단축키_핸드아웃.pdf">⬇ A4 PDF 내려받기</a>' +
      '<a href="' + SHOT_DIR + 'shortcut-handout.png" target="_blank" rel="noopener">새 창에서 크게 보기 ↗</a></div>' +
      '<img src="' + SHOT_DIR + 'shortcut-handout.png" alt="스마트 판서 단축키 핸드아웃">' +
      '<table class="sc-table"><thead><tr><th>단축키</th><th>기능</th><th>분류</th></tr></thead><tbody>' +
      SC.map(function (g) { return g[1].map(function (r) { return '<tr><td>' + r[0].split(' · ').map(function (t) { return t.split(' / ').map(function (u) { return /^(꾹 멈춤|1~6|← →)$/.test(u) ? '<kbd>' + u + '</kbd>' : k(u); }).join(' / '); }).join(' · ') + '</td><td>' + r[1] + (r[2] ? ' <em>' + r[2] + '</em>' : '') + '</td><td>' + g[0] + '</td></tr>'; }).join(''); }).join('') +
      '</tbody></table>' + pager('handout') + '</section>';
    // 자주 묻는 질문
    html += '<section class="page faq" id="p-faq"><div class="crumb">부록</div><h2>자주 묻는 질문</h2><p class="lead">막히는 부분이 있으면 여기부터 확인하세요.</p>' +
      '<details open><summary>판서한 내용은 어디에 저장되나요?</summary><p>지금 쓰는 기기의 브라우저 안에 1분마다 자동 저장되고, 서버로 보내지 않습니다. 같은 기기 · 같은 브라우저에서 다시 열면 마지막 판서로 돌아옵니다. 브라우저 데이터를 지우면 함께 지워지니 가끔 <b>백업·복원 ▾ → 전체 노트 백업(.json)</b>을 내려받아 두세요.</p></details>' +
      '<details><summary>예전 주소에서 쓰던 노트를 새 주소(board-tong)로 옮기려면?</summary><ul>' +
      '<li>예전 노트는 그때 쓰던 기기 · 브라우저의 예전 주소에 그대로 남아 있습니다.</li>' +
      '<li>그 기기에서 예전 주소(<a href="https://t-ong.vercel.app/smart-board.html" target="_blank" rel="noopener">t-ong.vercel.app/smart-board.html</a>)를 열고 <b>백업·복원 ▾ → 전체 노트 백업(.json)</b>을 내려받습니다.</li>' +
      '<li>새 주소(<a href="https://t98advisor1.github.io/board-tong/" target="_blank" rel="noopener">t98advisor1.github.io/board-tong</a> 또는 <a href="https://boardtong.vercel.app/" target="_blank" rel="noopener">boardtong.vercel.app</a>)에서 <b>백업·복원 ▾ → 백업 파일 불러오기 / 복원</b>으로 그 파일을 고르면 폴더와 판서가 그대로 돌아옵니다.</li></ul></details>' +
      '<details><summary>영상에서 소리가 나지 않아요.</summary><p>영상 아래 재생 막대의 스피커 아이콘이 꺼져 있지 않은지, 기기 소리가 켜져 있는지 확인하세요. 해설 음성은 기계 음성이라 조금 딱딱할 수 있습니다. 화면 아래 자막에 같은 내용이 나옵니다.</p></details>' +
      '<details><summary>갤럭시탭 · S펜으로 쓸 때 팁이 있나요?</summary><ul><li><b>설정 → S펜자동</b>을 켜 두면 S펜이 닿는 순간 손바닥은 무시하고, 손가락은 확대 · 이동만 합니다.</li>' +
      '<li><b>S펜버튼</b>이 켜져 있으면 S펜 옆 버튼으로 지우개와 펜을 바로 바꿉니다.</li><li>화면을 크게 쓰려면 <b>자동숨김</b>과 <b>전체화면</b>을 함께 켜세요.</li></ul></details>' +
      '<details><summary>' + k('Ctrl+1') + '을 눌렀더니 브라우저 탭이 바뀌어요.</summary><p>일부 브라우저는 ' + k('Ctrl+1') + '을 탭 이동에 씁니다. 그럴 때는 위쪽 <b>확대</b> 버튼을 누르거나, 스마트 판서를 앱으로 설치(홈 화면에 추가)해서 쓰세요. 예전 단축키 ' + k('Alt+1') + '도 동작합니다.</p></details>' +
      '<details><summary>유튜브나 웹 사이트가 보드 안에서 열리지 않아요.</summary><p>일부 사이트는 다른 화면 안에 띄우는 것을 막아 둡니다. <b>새 탭 ↗</b>으로 열거나 <b>스냅샷 고정</b>으로 화면을 그림으로 가져와 판서하세요.</p></details>' +
      '<details><summary>PPTX가 원본과 조금 달라 보여요.</summary><p>클릭 애니메이션 · 그룹 · 자동 재생은 따라가지만, 동영상 · 3D · 특수 효과는 그림으로 보입니다. 원본과 많이 다르면 PDF로 저장해서 여는 방법이 가장 정확합니다.</p></details>' +
      '<details><summary>손글씨 변환(OCR)이 잘 안 돼요.</summary><p>무료 엔진은 또박또박 쓴 글씨에 맞춰져 있습니다. 흘림체나 수식은 <b>설정 → AI 손글씨 OCR 설정</b>에 Google AI Studio의 Gemini 키를 넣으면 더 정확해집니다.</p></details>' +
      pager('faq') + '</section>';
    content.innerHTML = html;

    // ── 쪽 바꾸기 (주소 #장이름) ────────────────────────────────
    function show(id) {
      if (ORDER.indexOf(id) < 0) id = 'home';
      document.querySelectorAll('video').forEach(function (v) { v.pause(); });
      document.querySelectorAll('.page').forEach(function (p) { p.classList.toggle('show', p.id === 'p-' + id); });
      side.querySelectorAll('a').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-id') === id); });
      var pg = document.getElementById('p-' + id);
      pg.querySelectorAll('video[data-src]').forEach(function (v) { if (!v.src) v.src = v.dataset.src; });
      document.body.classList.remove('menu-open');
      window.scrollTo(0, 0);
      var act = side.querySelector('a.active'); if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest' });
      document.title = (CH[id] ? CH[id].n + '장 ' + CH[id].title : label(id)[1]) + ' — 스마트 판서 사용설명서';
    }
    window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
    show(location.hash.slice(1));

    // 영상: 속도 · 크게 보기 · 한 번에 하나만 재생
    content.addEventListener('click', function (e) {
      var b = e.target.closest('.video-tools button'); if (!b) return;
      var vid = b.closest('.vwrap').querySelector('video');
      if (b.hasAttribute('data-fs')) { (vid.requestFullscreen || vid.webkitEnterFullscreen || function () {}).call(vid); return; }
      vid.playbackRate = +b.getAttribute('data-rate');
      b.parentElement.querySelectorAll('[data-rate]').forEach(function (x) { x.classList.toggle('on', x === b); });
    });
    document.addEventListener('play', function (e) { document.querySelectorAll('video').forEach(function (v) { if (v !== e.target) v.pause(); }); }, true);
    // 스크린샷은 눌러서 새 창으로 크게
    content.addEventListener('click', function (e) { var img = e.target.closest('.shot img'); if (img) window.open(img.src, '_blank', 'noopener'); });

    document.getElementById('menuToggle').addEventListener('click', function () { document.body.classList.toggle('menu-open'); });
    document.body.addEventListener('click', function (e) { if (document.body.classList.contains('menu-open') && !e.target.closest('.side') && !e.target.closest('#menuToggle')) document.body.classList.remove('menu-open'); });
    document.getElementById('printBtn').addEventListener('click', function () { window.print(); });

    // 스마트 판서 익명 방문 통계 (로컬 실행에서는 집계하지 않음)
    (async function loadGuideVisitStats() {
      var h0 = location.hostname;
      if (h0 === 'localhost' || h0 === '127.0.0.1') return;
      try {
        var base = /^t-ong\.vercel\.app$/i.test(h0) ? '' : 'https://t-ong.vercel.app';
        var r = await fetch(base + '/api/classroom-hello?m=smartboard&_=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) r = await fetch(base + '/api/usage?scope=smartboard', { cache: 'no-store' });
        if (!r.ok) throw new Error('status ' + r.status);
        var d = await r.json();
        document.getElementById('guideTodayVisitors').textContent = Number(d.todayVisitors != null ? d.todayVisitors : d.d || 0).toLocaleString('ko-KR');
        document.getElementById('guideTotalVisits').textContent = Number(d.totalVisits != null ? d.totalVisits : d.v || 0).toLocaleString('ko-KR');
      } catch (err) {}
    })();
  })();
  </script>
