<style>

        (probs.length ? '<div class="msg bad">' + probs.map(esc).join('<br>') + '</div>' : '') +
        '<div class="msg info">A~D는 5% 단위, E는 1% 단위입니다. 입력한 값은 이 기기에 임시 저장되어, 창을 닫았다가 링크를 다시 열어도 남아 있습니다.</div></div>' +
        '<div class="box"><h2>③ 대표 교사에게 보내기</h2><button class="btn pri" id="jMake" style="font-size:15px;padding:8px 16px">응답 코드 만들기</button><div id="jOut"></div></div>';
      var sel = $('jT'), nm = $('jTn');
      sel.onchange = function () { if (sel.value === '__new') { nm.style.display = ''; nm.focus(); draft.t = nm.value.trim(); } else { nm.style.display = 'none'; draft.t = sel.value; } keep(); };
      nm.oninput = function () { draft.t = nm.value.trim(); keep(); };
      document.querySelectorAll('[data-jc]').forEach(function (el) { el.onchange = function () { var r = draft.r[el.dataset.jc] = draft.r[el.dataset.jc] || {}; r[el.dataset.l] = el.value === '' ? '' : +el.value; keep(); draw(); }; });
      $('jMake').onclick = function () {
        var t = cuts(), p = ratingProblems(fake, draft.r, cats);
        if (!draft.t) { alert('① 이름을 먼저 골라 주세요.'); return; }
        if (!t.ok) { alert('비어 있는 칸이 있습니다. 모든 칸을 채워 주세요.'); return; }
        if (p.length) { alert('고칠 곳이 있습니다:\n' + p.join('\n')); return; }
        var code = enc({ v: 1, k: 'r', sid: o.sid, eid: o.eid, rn: o.rn, sub: o.sub, t: draft.t, r: draft.r });
        var link = baseUrl() + '#reply=' + code;
        $('jOut').innerHTML = '<div class="msg ok">' + esc(draft.t) + ' 선생님의 분할점수: ' + lv.map(function (L) { return CUT_LABEL[L] + ' ' + f2(t.cuts[L]); }).join(' · ') + '</div>' +
          '<div class="share"><div class="side"><b>응답 코드</b> — 복사해서 메신저로 대표 교사에게 보내 주세요.<textarea rows="4" readonly>' + esc(code) + '</textarea><p><button class="btn pri" id="jCc">응답 코드 복사</button> <button class="btn" id="jCl">응답 링크 복사</button></p>' +
          '<p class="hint">대표 교사가 태블릿·휴대폰으로 작업 중이면 그 기기 카메라로 오른쪽 QR을 찍어도 바로 반영됩니다.</p></div><div class="qrbox">' + qrSvg(link) + '</div></div>';
        $('jCc').onclick = function () { copyText(code, this); }; $('jCl').onclick = function () { copyText(link, this); };
      };
    }
    function keep() { try { localStorage.setItem(DK, JSON.stringify(draft)); } catch (e) {} }
    document.body.classList.add('joining');
    draw();
  }
  function routeShare() {
    var h = location.hash; document.body.classList.remove('joining');
    if (h.indexOf('#join=') === 0) { try { joinView(dec(h)); } catch (e) { $('main').innerHTML = '<div class="msg bad">참여 링크를 읽지 못했습니다. 링크 전체가 복사되었는지 확인해 주세요.</div>'; } return true; }
    if (h.indexOf('#reply=') === 0) {
      try { var r = applyReply(dec(h)); history.replaceState(null, '', baseUrl() + '#examResult'); render(); if (r) alert(r.t + ' 선생님의 ' + r.rd.no + '라운드 응답을 반영했습니다.'); }
      catch (e) { history.replaceState(null, '', baseUrl() + '#guide'); render(); alert(e.message || '응답 코드를 읽지 못했습니다.'); }
      return true;
    }
    return false;
  }

  // ── 백업 · 복원 ─────────────────────────────────────────────
  function download(blob, name) { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 3000); }
  $('backupBtn').onclick = function () { download(new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' }), '추정분할점수_백업_' + new Date().toISOString().slice(0, 10) + '.json'); };
  $('restoreBtn').onclick = function () { $('restoreInput').click(); };
  $('restoreInput').onchange = function () { var f = this.files[0]; if (!f) return; f.text().then(function (t) { try { var d = JSON.parse(t); if (!Array.isArray(d.subjects)) throw 0;
    if (!confirm('백업의 과목 ' + d.subjects.length + '개를 불러옵니다. 같은 과목은 백업 내용으로 바뀝니다.')) return;
    d.subjects.forEach(function (s) { db.subjects = db.subjects.filter(function (x) { return x.id !== s.id; }); db.subjects.push(s); }); db.current = d.current || db.current; save(); render(); } catch (e) { alert('백업 파일을 읽지 못했습니다.'); } }); this.value = ''; };
  $('menuBtn').onclick = function () { document.body.classList.toggle('lnb-open'); };
  window.addEventListener('hashchange', function () { if (!routeShare()) render(); });
  if (!db.current && db.subjects[0]) db.current = db.subjects[0].id;
  if (!routeShare()) render();
  // 점검용
  window.__tongCut = { db: function () { return db; }, finalCuts: finalCuts, roundResult: roundResult, categories: categories, teacherCuts: teacherCuts };
})();
</script>
