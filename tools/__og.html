<!-- 링크 공유 썸네일(og:image) 생성용 — 1200×630. 배포 제외. -->
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden;
    font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 55%, #8e5bb5 100%);
    display: flex; align-items: center; gap: 54px; padding: 0 66px; position: relative; }
  body::before { content: ''; position: absolute; inset: -40%;
    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.045) 0deg 9deg, transparent 9deg 18deg); }
  .left { position: relative; width: 470px; flex-shrink: 0; color: #fff; }
  .badge { display: inline-block; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.35);
    padding: 8px 16px; border-radius: 999px; font-size: 20px; font-weight: 700; margin-bottom: 22px; }
  h1 { font-size: 68px; font-weight: 900; line-height: 1.12; letter-spacing: -0.02em; margin-bottom: 18px; }
  h1 em { font-style: normal; color: #ffd54f; }
  h1 small { margin-left: 13px; color: rgba(255,255,255,.86); font-size: 18px; font-weight: 800; letter-spacing: .08em; vertical-align: .32em; }
  p strong { color: #ffe783; font-size: 27px; }
  p { font-size: 25px; line-height: 1.5; color: rgba(255,255,255,0.9); margin-bottom: 26px; }
  .tags { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 30px; }
  .tag { background: rgba(255,255,255,0.16); padding: 7px 15px; border-radius: 9px; font-size: 19px; font-weight: 600; }
  .url { font-size: 25px; font-weight: 800; color: #ffd54f; letter-spacing: 0.01em; }

  .right { position: relative; flex: 1; }
  .board { background: rgba(255,255,255,0.97); border-radius: 22px; padding: 24px 22px 26px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.3); }
  .desk { width: 62%; margin: 0 auto 18px; background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; text-align: center; padding: 11px; border-radius: 0 0 15px 15px;
    font-weight: 800; font-size: 19px; letter-spacing: 9px; }
  .rows { display: flex; flex-direction: column; gap: 9px; }
  .row { display: flex; gap: 17px; justify-content: center; }
  .grp { display: flex; gap: 5px; }
  .seat { width: 62px; height: 48px; border-radius: 9px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; border: 2px solid transparent; }
  .seat b { font-size: 14px; font-weight: 700; color: #2f3550; }
  .seat i { font-style: normal; font-size: 9px; color: #9aa0b4; }
  .m { background: linear-gradient(135deg, #e3f2fd, #bbdefb); border-color: #64b5f6; }
  .f { background: linear-gradient(135deg, #fce4ec, #f8bbd9); border-color: #f06292; }
  .lk { box-shadow: 0 0 0 3px #ff9800; }
.teacher-board{padding:0;overflow:hidden;height:500px}.teacher-board img{width:100%;height:100%;object-fit:cover;display:block}
</style>

<div class="left">
  <div class="badge">👩‍🏫 담임·교과교사를 위한 올인원 교무수첩</div>
  <h1><em>T-ong</em><small>교무수첩</small></h1>

  <div class="tags">

    <span class="tag">📅 일정 · 상담</span>

  </div>
  <div class="url">t-ong.vercel.app</div>
</div>
